<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Demo HorariaPro</title>
<meta name="description" content="Recorregut interactiu d'HorariaPro: d'un avís d'absència a la cobertura notificada, en menys d'un minut.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F4F2EA">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='6 2 36 44'%3E%3Cpath d='M11 5 V41 M11 26 C11 18.5 15.5 15.5 20.5 15.5 C26 15.5 29 19 29 25 V37 L38.5 25' fill='none' stroke='%231A7A4E' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* ===== Marca "Guix" (mateixos tokens que l'app) ===== */
:root{
  --bg:#F4F2EA; --bg-2:#ECE9DF; --bg-3:#E3E0D4; --surface:#FFFFFF; --pis:#1E3A2F;
  --ink:#14271F; --ink-2:#33463D; --ink-3:#4E5E56; --ink-4:#A3AEA6;
  --border:rgba(20,39,31,.1); --border-2:rgba(20,39,31,.16);
  --green:#1A7A4E; --green-h:#156640; --green-bg:#E1EEE3; --green-mid:#A8DDB5; --on-green:#FFFFFF;
  --red:#C43B2A; --red-bg:#FAECEA; --red-mid:#EBADAD;
  --amber:#9A5A08; --amber-bg:#FDF3E3; --amber-mid:#F0D5A8;
  --blue:#2B5BAA; --blue-bg:#EBF0FA;
  --teal:#00695C; --teal-bg:#E0F2F1; --teal-mid:#80CBC4;
  --sh:0 1px 3px rgba(20,39,31,.06),0 0 1px rgba(20,39,31,.08);
  --sh-lg:0 8px 32px rgba(20,39,31,.14),0 0 1px rgba(20,39,31,.1);
  --sh-xl:0 30px 80px -24px rgba(20,39,31,.38),0 0 0 1px rgba(20,39,31,.06);
  --r:12px; --r-sm:8px;
  --font:'Geist',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#14271F; --bg-2:#183126; --bg-3:#234A39; --surface:#1E3A2F; --pis:#0F1F18;
    --ink:#F4F2EA; --ink-2:#C8CEC5; --ink-3:#A9B5AD; --ink-4:#5F7268;
    --border:rgba(244,242,234,.12); --border-2:rgba(244,242,234,.2);
    --green:#3FA873; --green-h:#4CB880; --green-bg:#234A39; --green-mid:#3F7A5C; --on-green:#0F1F18;
    --red:#E9806F; --red-bg:#4F2720; --red-mid:#7A3A30;
    --amber:#E8B465; --amber-bg:#4A3A12; --amber-mid:#7A6020;
    --blue:#8FBBEE; --blue-bg:#1C3344;
    --teal:#7FD1C5; --teal-bg:#173B37; --teal-mid:#2F6A62;
    --sh:0 1px 3px rgba(0,0,0,.3),0 0 1px rgba(0,0,0,.4);
    --sh-lg:0 8px 32px rgba(0,0,0,.45),0 0 1px rgba(0,0,0,.4);
    --sh-xl:0 30px 80px -24px rgba(0,0,0,.7),0 0 0 1px rgba(244,242,234,.08);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#14271F; --bg-2:#183126; --bg-3:#234A39; --surface:#1E3A2F; --pis:#0F1F18;
  --ink:#F4F2EA; --ink-2:#C8CEC5; --ink-3:#A9B5AD; --ink-4:#5F7268;
  --border:rgba(244,242,234,.12); --border-2:rgba(244,242,234,.2);
  --green:#3FA873; --green-h:#4CB880; --green-bg:#234A39; --green-mid:#3F7A5C; --on-green:#0F1F18;
  --red:#E9806F; --red-bg:#4F2720; --red-mid:#7A3A30;
  --amber:#E8B465; --amber-bg:#4A3A12; --amber-mid:#7A6020;
  --blue:#8FBBEE; --blue-bg:#1C3344;
  --teal:#7FD1C5; --teal-bg:#173B37; --teal-mid:#2F6A62;
  --sh:0 1px 3px rgba(0,0,0,.3),0 0 1px rgba(0,0,0,.4);
  --sh-lg:0 8px 32px rgba(0,0,0,.45),0 0 1px rgba(0,0,0,.4);
  --sh-xl:0 30px 80px -24px rgba(0,0,0,.7),0 0 0 1px rgba(244,242,234,.08);
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;font-family:var(--font);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.45;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.ic{display:inline-block;vertical-align:-.18em;flex-shrink:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ===== Capçalera de la demo ===== */
.top{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.top-in{max-width:1240px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:16px}
.logo{display:flex;align-items:center;flex-shrink:0;color:var(--ink)}
.logo svg{height:20px;width:auto}
.steps{display:flex;gap:4px;flex:1;justify-content:center;min-width:0}
.st{display:flex;align-items:center;gap:8px;border:1px solid transparent;background:none;padding:6px 12px 6px 6px;border-radius:999px;font-size:13px;font-weight:500;color:var(--ink-3);white-space:nowrap;transition:background .15s,color .15s}
.st:hover{background:var(--bg-2)}
.st .n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600;background:var(--bg-3);color:var(--ink-2)}
.st.on{background:var(--surface);border-color:var(--border-2);color:var(--ink);box-shadow:var(--sh)}
.st.on .n{background:var(--green);color:var(--on-green)}
.st.done .n{background:var(--green-bg);color:var(--green)}
.top-r{display:flex;align-items:center;gap:8px;flex-shrink:0}
.timer{display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--border-2);font-size:12px;color:var(--ink-3)}
.timer b{font-family:var(--mono);font-size:14px;color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}
.timer.ok{background:var(--green-bg);border-color:var(--green-mid);color:var(--green)}
.timer.ok b{color:var(--green)}
.icbtn{width:36px;height:36px;border-radius:10px;border:1px solid var(--border-2);background:var(--surface);display:grid;place-items:center;color:var(--ink-2)}
.icbtn:hover{background:var(--bg-2)}
.explain{max-width:1240px;margin:0 auto;padding:14px 20px 0;display:flex;align-items:flex-start;gap:12px;font-size:14px;color:var(--ink-2)}
.explain .eic{width:32px;height:32px;border-radius:10px;background:var(--green-bg);color:var(--green);display:grid;place-items:center;flex-shrink:0}
.explain strong{color:var(--ink);font-weight:600}
.atri{display:inline-flex;align-items:center;background:#B3271E;color:#fff;font-weight:600;font-size:11px;padding:1px 7px;border-radius:4px;margin:0 2px;vertical-align:1px}
.nav-next{display:flex;gap:8px;margin-left:auto;flex-shrink:0}
.stage{max-width:1240px;margin:0 auto;padding:18px 20px 48px}

/* ===== Botons i peces comunes ===== */
.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;border:1px solid var(--border-2);background:var(--surface);padding:9px 14px;font-size:13.5px;font-weight:600;color:var(--ink-2);transition:background .15s,transform .1s,border-color .15s}
.btn:hover{background:var(--bg-2)}
.btn:active{transform:scale(.98)}
.btn-g{background:var(--green);border-color:var(--green);color:var(--on-green)}
.btn-g:hover{background:var(--green-h)}
.btn-sm{padding:6px 10px;font-size:12.5px;border-radius:8px}
.btn-full{width:100%}
.btn-lg{padding:13px 16px;font-size:15px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;border:1px solid var(--border-2);white-space:nowrap}
.c-g{background:var(--green-bg);color:var(--green);border-color:var(--green-mid)}
.c-r{background:var(--red-bg);color:var(--red);border-color:var(--red-mid)}
.c-a{background:var(--amber-bg);color:var(--amber);border-color:var(--amber-mid)}
.c-b{background:var(--blue-bg);color:var(--blue);border-color:transparent}
.c-n{background:var(--bg-2);color:var(--ink-3)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--sh)}
.lbl{display:block;font-size:12px;font-weight:600;color:var(--ink-3);margin-bottom:6px}
.ctl{width:100%;padding:10px 12px;border-radius:var(--r-sm);border:1px solid var(--border-2);background:var(--surface);font-size:14px;outline:none;transition:border-color .2s,box-shadow .2s}
.ctl:focus{border-color:var(--green);box-shadow:0 0 0 3px var(--green-bg)}
textarea.ctl{resize:vertical;min-height:84px;line-height:1.45}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600;color:#fff!important;flex-shrink:0}
.muted{color:var(--ink-3)}
.h1{font-size:22px;font-weight:600;letter-spacing:-.01em;margin:0}
.sub{font-size:13px;color:var(--ink-3);margin:2px 0 0}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:rot .7s linear infinite;display:inline-block}
@keyframes rot{to{transform:rotate(360deg)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:translateY(-8px) scale(.98)}100%{opacity:1;transform:none}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(196,59,42,.45)}50%{box-shadow:0 0 0 7px rgba(196,59,42,0)}}
.fade{animation:fadeUp .28s ease-out both}
.nofx,.nofx .ok{animation:none!important}

/* ===== Pas 1: mòbil del docent ===== */
.s0{display:grid;grid-template-columns:minmax(0,400px) minmax(0,1fr);gap:40px;align-items:start;justify-content:center}
.chan{display:flex;gap:4px;padding:4px;background:var(--bg-2);border-radius:12px;margin:0 auto 14px;width:fit-content;max-width:100%}
.chan button{border:none;background:none;padding:8px 11px;border-radius:9px;font-size:13px;font-weight:600;color:var(--ink-3);display:flex;align-items:center;gap:6px;white-space:nowrap}
.chan button.on{background:var(--surface);color:var(--ink);box-shadow:var(--sh)}
.phone{width:372px;max-width:100%;margin:0 auto;background:#0E1A14;border-radius:54px;padding:11px;box-shadow:var(--sh-xl)}
.screen{position:relative;height:752px;border-radius:44px;overflow:hidden;background:var(--bg);display:flex;flex-direction:column}
.sbar{height:46px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 28px 0 34px;font-size:14px;font-weight:600;position:relative}
.sbar::after{content:"";position:absolute;left:50%;top:10px;width:104px;height:28px;border-radius:20px;background:#0E1A14;transform:translateX(-50%)}
.sbar i{display:flex;gap:5px;align-items:center}
.pscroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.pscroll::-webkit-scrollbar{display:none}
.phead{display:flex;align-items:center;gap:10px;padding:8px 18px 10px;border-bottom:1px solid var(--border)}
.phead .t{flex:1;min-width:0}
.phead .t p{margin:0;font-size:14px;font-weight:600;line-height:1.2}
.phead .t span{font-size:11.5px;color:var(--ink-3)}
.pbody{padding:16px 18px 28px}
.hello{font-size:13px;color:var(--ink-3);margin:0}
.ph1{font-size:25px;line-height:1.12;font-weight:600;margin:2px 0 4px;letter-spacing:-.015em}
.quick{width:100%;text-align:left;border:1.5px solid var(--border-2);background:var(--surface);border-radius:16px;padding:14px 16px;display:flex;align-items:center;gap:12px;margin:14px 0 10px;transition:border-color .15s,background .15s}
.quick .qi{width:42px;height:42px;border-radius:12px;background:var(--red-bg);color:var(--red);display:grid;place-items:center;flex-shrink:0}
.quick b{display:block;font-size:16px;font-weight:600}
.quick span{font-size:12px;color:var(--ink-3)}
.quick.on{border-color:var(--green);background:var(--green-bg)}
.quick.on .qi{background:var(--green);color:var(--on-green)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:3px;background:var(--bg-2);border-radius:10px;margin-bottom:12px}
.seg button{border:none;background:none;padding:7px 4px;border-radius:8px;font-size:12px;font-weight:600;color:var(--ink-3)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--sh)}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.frb{border:1.5px solid var(--border-2);background:var(--surface);border-radius:12px;padding:9px 10px;text-align:left;transition:border-color .15s,background .15s}
.frb b{display:block;font-size:13px;font-weight:600}
.frb span{font-size:11.5px;color:var(--ink-3)}
.frb.on{border-color:var(--green);background:var(--green-bg)}
.frb.on b{color:var(--green)}
.frb:disabled{opacity:.55}
.hora{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.affects{font-size:12px;background:var(--bg-2);border-radius:10px;padding:8px 10px;color:var(--ink-2);margin-bottom:10px}
.field{margin-top:16px}
.atri-tip{margin-top:8px;display:flex;gap:8px;align-items:flex-start;font-size:12px;color:var(--ink-2);background:var(--amber-bg);border:1px solid var(--amber-mid);border-radius:10px;padding:8px 10px}
.drop{width:100%;border:1.5px dashed var(--border-2);background:var(--surface);border-radius:12px;padding:12px;text-align:center;font-size:13px;color:var(--ink-2)}
.drop small{display:block;font-size:11.5px;color:var(--ink-3);margin-top:2px}
.drop.ok{border-style:solid;border-color:var(--green-mid);background:var(--green-bg);color:var(--green);font-weight:600}
.sent{position:absolute;inset:46px 0 0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;animation:fadeUp .3s ease-out}
.sent .ok{width:76px;height:76px;border-radius:50%;background:var(--green);color:var(--on-green);display:grid;place-items:center;margin-bottom:16px;animation:pop .4s ease-out}
.sent h3{margin:0 0 6px;font-size:21px;font-weight:600}
.sent p{margin:0;font-size:13.5px;color:var(--ink-3);max-width:250px}
.sent .opening{margin-top:22px;font-size:12px;color:var(--green);display:flex;align-items:center;gap:8px}
/* WhatsApp */
.wa{flex:1;display:flex;flex-direction:column;background:#EFE7DD;min-height:0}
:root[data-theme="dark"] .wa{background:#0B141A}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .wa{background:#0B141A}}
.wa-h{background:#075E54;color:#fff;display:flex;align-items:center;gap:10px;padding:10px 14px}
.wa-h p{margin:0;font-size:15px;font-weight:600}
.wa-h span{font-size:11.5px;opacity:.85}
.wa-b{flex:1;padding:16px 12px;display:flex;flex-direction:column;gap:8px;overflow-y:auto}
.wa-day{align-self:center;background:rgba(255,255,255,.85);color:#54656F;font-size:11.5px;padding:3px 10px;border-radius:8px}
.bub{max-width:84%;padding:7px 10px 18px;border-radius:10px;font-size:14px;position:relative;line-height:1.35;color:#111B21;animation:fadeUp .25s ease-out both}
.bub time{position:absolute;right:8px;bottom:3px;font-size:10.5px;color:#667781}
.bub.in{background:#fff;align-self:flex-start;border-top-left-radius:2px}
.bub.out{background:#D9FDD3;align-self:flex-end;border-top-right-radius:2px}
.bub .fw{font-size:11.5px;color:#667781;font-style:italic;display:block;margin-bottom:2px}
.voice{display:flex;align-items:center;gap:8px;min-width:210px}
.voice .pl{width:30px;height:30px;border-radius:50%;background:#00A884;color:#fff;display:grid;place-items:center;flex-shrink:0}
.voice .wv{flex:1;display:flex;align-items:center;gap:2px;height:22px}
.voice .wv i{flex:1;background:#8696A0;border-radius:2px}
.wa-act{padding:10px 12px 18px;display:flex;flex-direction:column;gap:8px}
.wa-act .btn{background:#fff;color:#075E54;border-color:#D1D7DB}
.wa-in{display:flex;gap:8px;align-items:center;padding:8px 10px 16px}
.wa-in div{flex:1;background:#fff;border-radius:20px;padding:9px 14px;font-size:14px;color:#8696A0}
.wa-in span{width:40px;height:40px;border-radius:50%;background:#00A884;color:#fff;display:grid;place-items:center}
.side h2{font-size:24px;font-weight:600;letter-spacing:-.015em;margin:4px 0 8px;line-height:1.2}
.side .lead{font-size:15px;color:var(--ink-2);margin:0 0 20px;max-width:520px}
.feat{display:grid;gap:10px;max-width:540px}
.feat div{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;background:var(--surface);border:1px solid var(--border);border-radius:12px}
.feat .fi{width:34px;height:34px;border-radius:10px;background:var(--green-bg);color:var(--green);display:grid;place-items:center;flex-shrink:0}
.feat b{display:block;font-size:14px;font-weight:600}
.feat span{font-size:13px;color:var(--ink-3)}
.new{font-size:10.5px;font-weight:600;color:var(--green);background:var(--green-bg);border:1px solid var(--green-mid);border-radius:999px;padding:1px 7px;margin-left:6px;vertical-align:1px}


/* Formulari real de l'app (AvisarPage) */
.thead{background:#14271F;border:1px solid rgba(244,242,234,.08);border-radius:var(--r);padding:18px 18px 16px;margin-bottom:14px;color:#fff}
.thead small{display:block;font-size:12px;color:rgba(255,255,255,.45);font-weight:600;margin-bottom:4px}
.thead b{display:block;font-size:22px;font-weight:600;margin-bottom:3px;line-height:1.2}
.thead em{font-style:italic;color:#B8DFC8}
.thead span{font-size:12.5px;color:rgba(255,255,255,.5)}
.meus{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;margin-bottom:14px}
.meus b{display:block;font-size:12.5px;font-weight:600;color:var(--ink-3);margin-bottom:8px}
.mline{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;font-weight:500}
.meus small{font-size:11.5px;color:var(--ink-3)}
.falto{width:100%;padding:18px 16px;background:var(--red);color:#fff;border:none;border-radius:var(--r);font-size:16px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:14px;text-align:left}
.falto small{display:block;font-size:12px;font-weight:400;opacity:.8}
.falto:active{transform:scale(.99)}
.divi{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:600;color:var(--ink-3);margin-bottom:12px}
.divi i{flex:1;height:1px;background:var(--border)}
.dbtns{display:flex;gap:10px;margin-bottom:12px}
.dbtns .btn{flex:1;flex-direction:column;padding:12px;gap:4px;font-size:12px}
.dchips{display:flex;flex-wrap:wrap;gap:8px}
.dchip{display:flex;align-items:center;gap:8px;padding:5px 6px 5px 5px;background:var(--green-bg);border:1.5px solid var(--green-mid);border-radius:24px;color:var(--green);font-weight:600;font-size:13px}
.dchip .dn{width:30px;height:30px;border-radius:50%;background:var(--green);color:var(--on-green);display:grid;place-items:center;font-size:13px;flex-shrink:0}
.dchip button{border:none;background:none;color:inherit;opacity:.6;font-size:17px;line-height:1;padding:0 6px}
.totdia{width:100%;padding:14px 16px;background:var(--red);color:#fff;border:none;border-radius:var(--r-sm);font-size:15px;font-weight:600;margin-bottom:10px;display:flex;align-items:center;justify-content:center;gap:8px}
.fgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fbtn{border:1.5px solid var(--border-2);border-radius:var(--r-sm);padding:11px 4px;text-align:center;background:var(--surface);transition:background .14s,border-color .14s,transform .1s}
.fbtn:active{transform:scale(.96)}
.fbtn b{display:block;font-size:13.5px;font-weight:600;margin-bottom:1px}
.fbtn span{font-size:11.5px;color:var(--ink-3)}
.fbtn.on{background:var(--green);border-color:var(--green);color:var(--on-green)}
.fbtn.on span{color:inherit;opacity:.75}
.fbtn.patio.on{background:var(--amber);border-color:var(--amber);color:#fff}
.alrt{margin-top:8px;font-size:12.5px;padding:8px 12px;border-radius:8px;background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-mid);display:flex;gap:7px;align-items:flex-start;line-height:1.4}
.fitx{display:flex;align-items:center;gap:8px;background:var(--bg-2);border-radius:8px;padding:8px 12px;margin-top:10px;font-size:13px;font-weight:500}
.fitx span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fitx small{font-size:11px;color:var(--ink-3)}
.fitx button{border:none;background:none;color:var(--ink-3);font-size:17px;font-weight:600;padding:0 4px}
.btn-redsoft{background:var(--red-bg);color:var(--red);border-color:transparent}
.btn-redsoft:hover{background:var(--red-bg);filter:brightness(.97)}
.cmchip{font-size:12px;padding:5px 11px;border-radius:20px;border:1.5px solid var(--border-2);background:var(--surface);color:var(--ink-2);font-weight:500}
.cmchip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.mgrid{display:flex;gap:10px;flex-wrap:wrap}
.mgrid>div{min-width:150px}
.pbody .actions{grid-template-columns:1fr}
.pbody .panel{max-width:none}


/* WhatsApp: reenviar i xat amb el bot Horaria */
.wa{position:relative}
.wa-hav{width:36px;height:36px;border-radius:50%;background:#1E3A2F;display:grid;place-items:center;flex-shrink:0}
.bub.sel{box-shadow:0 0 0 2px #00A884}
.bub .wa-link{color:#027EB5;word-break:break-all}
.wa-b{scroll-behavior:smooth}
.wa-typing{display:flex;gap:4px;padding:12px 14px!important}
.wa-typing i{width:7px;height:7px;border-radius:50%;background:#8696A0;animation:bl 1.2s infinite}
.wa-typing i:nth-child(2){animation-delay:.15s}.wa-typing i:nth-child(3){animation-delay:.3s}
.wa-ask{margin-bottom:0}
.wa-btns{align-self:flex-start;width:84%;display:grid;gap:3px;margin-top:-5px}
.wa-btns button{background:#fff;border:none;border-radius:8px;padding:9px;color:#027EB5;font-weight:500;font-size:14px;box-shadow:0 1px .5px rgba(11,20,26,.13)}
.wa-btns button:hover:not(:disabled){background:#F5F6F6}
.wa-btns button:disabled{color:#8696A0;cursor:default}
.wa-scrim{position:absolute;inset:0;background:rgba(11,20,26,.4);z-index:5;animation:fadeUp .2s ease-out}
.wa-sheet{position:absolute;left:0;right:0;bottom:0;z-index:6;background:#fff;color:#111B21;border-radius:18px 18px 0 0;padding:10px 0 22px;animation:slideUp .28s cubic-bezier(.2,.8,.2,1)}
@keyframes slideUp{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.wa-sh-h{display:flex;align-items:center;gap:10px;padding:6px 14px 10px}
.wa-sh-h b{font-size:16px;font-weight:600}
.wa-x{border:none;background:none;color:#54656F;width:32px;height:32px;display:grid;place-items:center}
.wa-sh-t{font-size:12.5px;color:#008069;font-weight:600;padding:6px 18px}
.wa-row{display:flex;align-items:center;gap:12px;padding:10px 18px;width:100%;border:none;background:none;text-align:left;color:#111B21}
button.wa-row:hover{background:#F5F6F6}
button.wa-row .ic{color:#00A884}
.wa-row span:not(.av):not(.wa-hav){flex:1;min-width:0}
.wa-row b{display:block;font-size:15px;font-weight:500}
.wa-row small{font-size:12.5px;color:#667781}
.wa-row.off{opacity:.55}

/* ===== Escriptori de la cap d'estudis ===== */
.shell{display:grid;grid-template-columns:220px minmax(0,1fr);background:var(--bg);border:1px solid var(--border);border-radius:18px;overflow:hidden;box-shadow:var(--sh-xl);min-height:700px;position:relative}
.sidebar{background:var(--surface);border-right:1px solid var(--border);padding:18px 12px;display:flex;flex-direction:column;gap:4px}
.sb-brand{padding:4px 8px 16px;border-bottom:1px solid var(--border);margin-bottom:10px}
.sb-brand svg{height:17px;width:auto}
.sb-brand p{margin:8px 0 0;font-size:12px;color:var(--ink-3)}
.nv{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;border:none;background:none;font-size:13.5px;font-weight:500;color:var(--ink-2);text-align:left;width:100%}
.nv:hover{background:var(--bg-2)}
.nv.on{background:var(--green-bg);color:var(--green);font-weight:600}
.nv .badge{margin-left:auto;min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;font-weight:600;display:grid;place-items:center;padding:0 5px}
.sb-user{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px 8px 2px;border-top:1px solid var(--border)}
.sb-user p{margin:0;font-size:13px;font-weight:600}
.sb-user span{font-size:11.5px;color:var(--ink-3)}
.main{padding:24px 28px 40px;min-width:0;position:relative}
.mhead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.crumb{font-size:12px;color:var(--ink-3);margin-bottom:4px}
.mob-head,.bnav{display:none}
.actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;max-width:540px;margin-bottom:12px}
.a-info{border:1.5px solid var(--green-mid);background:var(--green-bg);color:var(--green)}
.a-info.on{background:color-mix(in srgb,var(--green-bg) 70%,var(--green-mid))}
.a-man{border:1.5px solid var(--teal-mid);background:var(--teal-bg);color:var(--teal)}
.a-info:hover,.a-man:hover{filter:brightness(.97)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}
.panel{margin:8px 0 14px;animation:fadeUp .25s ease-out both;max-width:720px}
.panel-h{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--border)}
.panel-h h3{margin:0;font-size:14px;font-weight:600}
.panel-b{padding:16px;display:flex;flex-direction:column;gap:14px}
.ta-wrap{position:relative}
.ta-wrap textarea{padding-right:62px;min-height:96px}
.ta-wrap textarea.flash{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-bg)}
.mic{position:absolute;right:8px;bottom:8px;width:44px;height:44px;border-radius:50%;border:1.5px solid var(--border-2);background:var(--surface);color:var(--ink-2);display:grid;place-items:center;transition:transform .12s,background .15s,border-color .15s}
.mic:hover{border-color:var(--green);color:var(--green)}
.mic:active{transform:scale(.92)}
.rec{position:absolute;inset:0;z-index:2;border-radius:var(--r-sm);display:flex;align-items:center;gap:10px;padding:0 12px;background:var(--surface);border:1.5px solid var(--red-mid);animation:fadeUp .16s ease-out}
.rec .rd{width:10px;height:10px;border-radius:50%;background:var(--red);animation:pulse 1.4s infinite;flex-shrink:0}
.rec .tm{font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums;color:var(--red);min-width:38px}
.bars{flex:1;display:flex;align-items:center;gap:3px;height:36px;min-width:0;overflow:hidden}
.bars i{flex:1;min-width:2px;height:100%;background:var(--red);border-radius:2px;transform:scaleY(.15);transition:transform .09s linear;opacity:.85}
.rb{flex-shrink:0;width:44px;height:44px;border-radius:50%;border:none;display:grid;place-items:center}
.rb.stop{background:var(--red);color:#fff}
.rb.x{background:var(--bg-2);color:var(--ink-2)}
.rec.tr{border-color:var(--blue);color:var(--blue);font-size:13.5px;font-weight:600;justify-content:center}
.hint{font-size:11.5px;color:var(--ink-3);text-align:right;margin-top:5px;display:flex;justify-content:flex-end;gap:5px;align-items:center}
.ph-row{display:flex;gap:8px}
.ph-row .btn{flex:1;min-height:48px;font-size:14px}
.b-cam{border:1.5px solid var(--green-mid);background:var(--green-bg);color:var(--green)}
.thumbs{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.thumb{position:relative;width:84px;height:84px;animation:pop .25s ease-out}
.thumb img{width:100%;height:100%;object-fit:cover;border-radius:8px;border:1px solid var(--border-2);display:block}
.thumb button{position:absolute;top:-7px;right:-7px;width:24px;height:24px;border-radius:50%;border:none;background:var(--green);color:var(--on-green);font-size:15px;line-height:1;display:grid;place-items:center}
.cnt{font-size:11.5px;font-weight:600;color:var(--ink-3)}
.cnt.full{color:var(--amber)}
.result{background:var(--green-bg);border:1px solid var(--green-mid);border-radius:12px;padding:14px 16px;animation:fadeUp .3s ease-out both}
.result h4{margin:0 0 8px;font-size:13.5px;font-weight:600;color:var(--green);display:flex;align-items:center;gap:8px}
.result ul{margin:0;padding:0;list-style:none;display:grid;gap:7px}
.result li{display:flex;gap:8px;font-size:13.5px;color:var(--ink-2);align-items:flex-start}
.result li .ic{color:var(--green);margin-top:2px}
.err{font-size:12.5px;color:var(--red);font-weight:500}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.list{display:flex;flex-direction:column;gap:10px;max-width:860px}
.ab{display:flex;align-items:center;gap:14px;padding:14px 16px;animation:fadeUp .3s ease-out both}
.date{width:50px;height:54px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;border:1px solid}
.date b{font-size:19px;font-weight:600;line-height:1}
.date span{font-size:11px;font-weight:600;margin-top:2px}
.d-r{background:var(--red-bg);border-color:var(--red-mid);color:var(--red)}
.d-g{background:var(--green-bg);border-color:var(--green-mid);color:var(--green)}
.ab .who{flex:1;min-width:0}
.ab .who p{margin:0;font-size:15px;font-weight:600}
.ab .who span{font-size:12.5px;color:var(--ink-3)}
.ab .cov{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.ab .cov .chip{padding:2px 8px 2px 3px}
.ab .cov .mini{width:18px;height:18px;border-radius:50%;font-size:9px;font-weight:600;color:#fff;display:grid;place-items:center}
.ab-r{display:flex;align-items:center;gap:8px;flex-shrink:0}
.btn-h{background:var(--green);color:var(--on-green);border:none;padding:9px 14px;border-radius:10px;font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:7px;box-shadow:0 6px 16px -6px rgba(26,122,78,.55)}
.btn-h:hover{background:var(--green-h)}
.attn{animation:attn 2s ease-in-out infinite}
@keyframes attn{0%,100%{box-shadow:0 6px 16px -6px rgba(26,122,78,.55),0 0 0 0 rgba(26,122,78,.35)}50%{box-shadow:0 6px 16px -6px rgba(26,122,78,.55),0 0 0 7px rgba(26,122,78,0)}}
.sec-t{font-size:12px;font-weight:600;color:var(--ink-3);margin:22px 0 10px}

/* Toast de notificació */
.toast{position:absolute;top:18px;right:18px;z-index:20;width:min(360px,calc(100% - 36px));padding:14px 16px;animation:pop .35s ease-out both;box-shadow:var(--sh-lg)}
.toast h4{margin:0;font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px;color:var(--green)}
.toast p{margin:2px 0 10px;font-size:12.5px;color:var(--ink-3)}
.rcp{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--border);animation:fadeUp .25s ease-out both}
.rcp .av{width:28px;height:28px;font-size:11px}
.rcp div{flex:1;min-width:0}
.rcp b{display:block;font-size:13px;font-weight:600}
.rcp span{font-size:11.5px;color:var(--ink-3)}
.rcp em{font-style:normal;font-size:11.5px;font-weight:600;color:var(--green);display:flex;align-items:center;gap:4px}

/* Xat Horaria */
.chat{position:absolute;top:0;right:0;bottom:0;width:min(470px,100%);background:var(--surface);border-left:1px solid var(--border);box-shadow:-20px 0 50px -20px rgba(20,39,31,.3);display:flex;flex-direction:column;z-index:15;animation:slideIn .32s cubic-bezier(.2,.8,.2,1) both}
@keyframes slideIn{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
.chat-scrim{position:absolute;inset:0;background:rgba(20,39,31,.18);z-index:14;animation:fadeUp .2s ease-out}
.chat-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border)}
.chat-h .hav{width:36px;height:36px;border-radius:12px;background:var(--pis);display:grid;place-items:center}
.chat-h p{margin:0;font-size:15px;font-weight:600}
.chat-h span{font-size:12px;color:var(--ink-3)}
.chat-b{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;background:var(--bg)}
.msg{max-width:90%;padding:10px 13px;border-radius:14px;font-size:14px;line-height:1.5;animation:fadeUp .28s ease-out both}
.msg.me{align-self:flex-end;background:var(--ink);color:var(--bg);border-bottom-right-radius:4px}
.msg.ai{align-self:flex-start;background:var(--surface);border:1px solid var(--border);border-bottom-left-radius:4px}
.msg .fw{display:block;font-size:12px;opacity:.75;font-style:italic;margin-bottom:4px}
.msg p{margin:0 0 8px}
.msg p:last-child{margin:0}
.typing{display:flex;align-items:center;gap:10px;color:var(--ink-3);font-size:13px}
.typing .dots{display:flex;gap:4px}
.typing .dots i{width:6px;height:6px;border-radius:50%;background:var(--green);animation:bl 1.2s infinite}
.typing .dots i:nth-child(2){animation-delay:.15s}.typing .dots i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
.ctx{display:flex;gap:8px;align-items:flex-start;background:var(--blue-bg);color:var(--ink-2);border-radius:10px;padding:8px 10px;font-size:13px;margin-bottom:8px}
.ctx .ic{color:var(--blue);margin-top:2px}
.prop{background:var(--green-bg);border:1px solid var(--green-mid);border-radius:12px;padding:12px;margin-top:4px}
.prop h5{margin:0 0 8px;font-size:12px;font-weight:600;color:var(--green)}
.prow{display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--surface);border-radius:9px;margin-bottom:6px;font-size:13.5px}
.prow b{font-weight:600}
.prow .when{font-size:12px;color:var(--ink-3);min-width:92px}
.prow .ic{margin-left:auto;color:var(--green)}
.chat-in{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--border);background:var(--surface)}
.chat-in div{flex:1;border:1px solid var(--border-2);border-radius:999px;padding:9px 14px;font-size:13.5px;color:var(--ink-3)}
.chat-in span{width:40px;height:40px;border-radius:50%;background:var(--green);color:var(--on-green);display:grid;place-items:center;opacity:.5}

/* Taules (Avui, Grups, Personal) */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:18px}
.kpi{padding:14px 16px}
.kpi span{font-size:12px;color:var(--ink-3);font-weight:500}
.kpi b{display:block;font-size:26px;font-weight:600;letter-spacing:-.02em;margin-top:2px}
.kpi small{font-size:12px;color:var(--ink-3)}
.tbl-w{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:var(--r);border:1px solid var(--border);background:var(--surface)}
table.tb{border-collapse:collapse;width:100%;min-width:620px;font-size:12.5px}
.tb th{font-weight:600;color:var(--ink-3);text-align:left;padding:9px 10px;border-bottom:1px solid var(--border);background:var(--bg-2);white-space:nowrap}
.tb td{padding:6px;border-bottom:1px solid var(--border);vertical-align:middle}
.tb tr:last-child td{border-bottom:none}
.tb td.h{white-space:nowrap;color:var(--ink-3);font-weight:500;padding-left:10px;width:96px}
.cell{border-radius:7px;padding:6px 8px;background:var(--bg-2);color:var(--ink-2);font-weight:500;white-space:nowrap;text-align:center}
.cell.r{background:var(--red-bg);color:var(--red);font-weight:600}
.cell.g{background:var(--green-bg);color:var(--green);font-weight:600}
.cell.a{background:var(--amber-bg);color:var(--amber);font-weight:600}
.cell.b{background:var(--blue-bg);color:var(--blue)}
.cell.p{background:transparent;color:var(--ink-3);border:1px dashed var(--border-2)}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--ink-3)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* Gestions */
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.gc{text-align:left;padding:16px;display:flex;gap:12px;align-items:flex-start;transition:border-color .15s,transform .15s}
.gc:hover{border-color:var(--green-mid);transform:translateY(-1px)}
.gc .gi{width:40px;height:40px;border-radius:11px;background:var(--green-bg);color:var(--green);display:grid;place-items:center;flex-shrink:0}
.gc b{display:block;font-size:14.5px;font-weight:600}
.gc span{font-size:12.5px;color:var(--ink-3)}
.back{margin-bottom:14px}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--border);width:100%;background:none;border-left:none;border-right:none;border-top:none;text-align:left}
.row:last-child{border-bottom:none}
.row .tx{flex:1;min-width:0}
.row .tx b{display:block;font-size:14px;font-weight:600}
.row .tx span{font-size:12.5px;color:var(--ink-3)}
.exp{padding:14px;background:var(--bg);border-bottom:1px solid var(--border);animation:fadeUp .2s ease-out}
.ff{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:14px}
.ff .v{font-size:14px;font-weight:500;padding:8px 10px;background:var(--surface);border:1px solid var(--border);border-radius:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.pill{border:1px solid var(--border-2);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:600;color:var(--ink-2)}
.pill.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.bars-h{display:grid;gap:8px}
.bh{display:grid;grid-template-columns:110px 1fr 28px;gap:10px;align-items:center;font-size:13px}
.bh i{display:block;height:10px;border-radius:5px;background:var(--green)}
.bh .tr{background:var(--bg-2);border-radius:5px}
.bh b{font-weight:600;text-align:right}
.tog{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;border-bottom:1px solid var(--border)}
.tog:last-child{border-bottom:none}
.tog .tx{flex:1}
.tog .tx b{display:block;font-size:14px;font-weight:600}
.tog .tx span{font-size:12.5px;color:var(--ink-3)}
.sw{position:relative;width:42px;height:24px;border-radius:12px;border:none;background:var(--bg-3);flex-shrink:0;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.sw[aria-checked="true"]{background:var(--green)}
.sw[aria-checked="true"]::after{transform:translateX(18px)}
.pgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.pday{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:8px;min-width:0}
.pday b{display:block;font-size:12px;font-weight:600;color:var(--ink-3);margin-bottom:6px}
.pchip{display:flex;align-items:center;gap:6px;font-size:12px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:4px 6px;margin-bottom:4px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.pchip .av{width:20px;height:20px;font-size:9px}

/* ===== Pas 5: correus ===== */
.mail{display:grid;grid-template-columns:290px minmax(0,1fr);border:1px solid var(--border);border-radius:18px;overflow:hidden;background:var(--surface);box-shadow:var(--sh-xl);min-height:600px}
.inbox{border-right:1px solid var(--border);background:var(--bg)}
.inbox-h{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.inbox-h b{font-size:15px;font-weight:600}
.mi{display:flex;gap:10px;padding:12px 16px;border:none;border-bottom:1px solid var(--border);background:none;width:100%;text-align:left;align-items:flex-start}
.mi:hover{background:var(--bg-2)}
.mi.on{background:var(--surface);box-shadow:inset 3px 0 0 var(--green)}
.mi .tx{flex:1;min-width:0}
.mi .tx b{display:flex;justify-content:space-between;font-size:13.5px;font-weight:600;gap:6px}
.mi .tx b time{font-size:11.5px;color:var(--ink-3);font-weight:500}
.mi .tx span{display:block;font-size:12.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mi .tx small{display:block;font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mread{padding:26px 30px;min-width:0}
.mread h2{font-size:20px;font-weight:600;margin:0 0 16px;letter-spacing:-.01em}
.from{display:flex;align-items:center;gap:12px;padding-bottom:16px;border-bottom:1px solid var(--border);margin-bottom:20px}
.from .hav{width:40px;height:40px;border-radius:50%;background:var(--pis);display:grid;place-items:center;flex-shrink:0}
.from b{font-size:14px;font-weight:600}
.from span{font-size:12.5px;color:var(--ink-3)}
.from time{margin-left:auto;font-size:12px;color:var(--ink-3);white-space:nowrap}
.mbody{max-width:560px;font-size:14.5px;color:var(--ink-2);line-height:1.6}
.mcard{border:1px solid var(--border);border-radius:14px;overflow:hidden;margin:6px 0 18px}
.mcard .mh{background:var(--pis);padding:14px 18px;display:flex;align-items:center;gap:10px}
.mcard .mh svg{height:16px;width:auto}
.mcard .mc{padding:18px}
.mrow{display:flex;gap:10px;padding:9px 12px;background:var(--bg);border-radius:9px;margin-bottom:6px;font-size:13.5px;flex-wrap:wrap}
.mrow span{color:var(--ink-3);min-width:96px}
.mrow b{font-weight:600}
.note{border-left:3px solid var(--green-mid);padding:6px 12px;color:var(--ink-2);font-style:italic;margin:10px 0}
.cta{display:inline-flex;align-items:center;gap:8px;background:var(--green);color:var(--on-green);padding:11px 18px;border-radius:10px;font-weight:600;font-size:14px;text-decoration:none;margin-top:6px}
.mfoot{font-size:12px;color:var(--ink-3);margin-top:20px}
.end{display:flex;justify-content:center;gap:10px;margin-top:22px;flex-wrap:wrap}

/* ===== Responsive ===== */
@media (max-width:1440px){
  .st .lb{display:none}
  .st{padding:6px}
  .st.on .lb{display:inline}
  .st.on{padding-right:12px}
}
@media (max-width:900px){
  .s0{grid-template-columns:1fr;gap:24px}
  .side{order:-1}
  .side .feat{display:none}
}
@media (max-width:760px){
  .top-in{padding:8px 14px;gap:10px;flex-wrap:wrap}
  .steps{order:3;flex-basis:100%;justify-content:space-between}
  .st .lb,.st.on .lb{display:none}
  .st,.st.on{padding:4px}
  .st .n{width:30px;height:30px;font-size:13px}
  .top-r{margin-left:auto}
  .timer span{display:none}
  .explain{padding:12px 16px 0;font-size:13.5px}
  .nav-next{display:none}
  .stage{padding:14px 12px 40px}
  .shell{grid-template-columns:1fr;border-radius:16px;min-height:640px;padding-bottom:86px}
  .sidebar{display:none}
  .mob-head{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border);background:color-mix(in srgb,var(--bg) 94%,transparent)}
  .mob-head .t{flex:1;min-width:0}
  .mob-head .t p{margin:0;font-size:14px;font-weight:600;line-height:1.2}
  .mob-head .t span{font-size:11.5px;color:var(--ink-3)}
  .bnav{display:flex;position:absolute;left:10px;right:10px;bottom:10px;height:66px;background:var(--surface);border-radius:999px;box-shadow:0 12px 30px -10px rgba(20,39,31,.38),0 0 0 1px var(--border);padding:5px;gap:2px;z-index:12}
  .bnav button{flex:1;border:none;background:none;border-radius:999px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10.5px;font-weight:500;color:var(--ink-3);min-width:0;position:relative}
  .bnav button.on{background:var(--green-bg);color:var(--green);font-weight:600}
  .bnav .badge{position:absolute;top:6px;right:calc(50% - 18px);width:8px;height:8px;border-radius:50%;background:var(--red)}
  .main{padding:16px 14px 28px}
  .h1{font-size:20px}
  .g2{grid-template-columns:1fr}
  .ab{flex-wrap:wrap}
  .ab-r{width:100%;justify-content:flex-end}
  .chat{position:fixed;inset:0;width:100%;z-index:80;border-left:none}
  .chat-scrim{display:none}
  .toast{position:fixed;top:auto;bottom:16px;right:12px;left:12px;width:auto;z-index:70}
  .mail{grid-template-columns:1fr;border-radius:16px}
  .inbox{border-right:none;border-bottom:1px solid var(--border)}
  .inbox-list{display:flex;overflow-x:auto;scrollbar-width:none}
  .inbox-list .mi{min-width:230px;border-bottom:none;border-right:1px solid var(--border)}
  .mi.on{box-shadow:inset 0 -3px 0 var(--green)}
  .mread{padding:20px 16px}
  .pgrid{grid-template-columns:repeat(5,minmax(120px,1fr));overflow-x:auto}
  .bh{grid-template-columns:90px 1fr 24px}
}
@media (max-width:420px){
  .phone{padding:0;background:none;box-shadow:none;border-radius:0}
  .screen{border-radius:22px;height:auto;min-height:640px;border:1px solid var(--border);box-shadow:var(--sh-lg)}
  .sbar{display:none}
  .sent{inset:0}
  .logo svg{height:17px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

/* Mode incrustat a la web (?embed=1) */
.embed .top,.embed .explain{display:none}
.embed .stage{padding:8px}
.embed body,body.embed{background:transparent}
</style>

function tr(s){
  if (LANG === 'ca' || s == null) return s;
  s = String(s);
  var m = s.match(/^(\s*)([\s\S]*?)(\s*)$/), core = m[2];
  if (!core || !/[A-Za-zÀ-ÿ]/.test(core)) return s;
  var out;
  if (LANG === 'va') { out = core; VA.forEach(function(r){ out = out.replace(r[0], r[1]); }); return m[1] + out + m[3]; }
  if (ES[core] !== undefined) out = ES[core];
  else {
    for (var i = 0; i < ES_PAT.length && out === undefined; i++) if (ES_PAT[i][0].test(core)) out = core.replace(ES_PAT[i][0], ES_PAT[i][1]);
    if (out === undefined && core.indexOf(' · ') >= 0) out = core.split(' · ').map(function(x){ return tr(x); }).join(' · ');
    if (out === undefined && /^· /.test(core)) out = '· ' + tr(core.slice(2));
    if (out === undefined) out = core;
  }
  return m[1] + out + m[3];
}

  clearT(); n = Math.max(0, Math.min(4, n|0));
  S.step = n; S.toast = false;
  if (n === 0) { S.sent = false; S.waFwd = false; S.t0 = Date.now(); }
  if (n >= 1 && n <= 3) S.jtab = 'avisos', S.gview = null;
  if (n >= 1 && !S.sel.length) { S.sel = FR.map(function(f){ return f.id; }); if (!S.motiu) S.motiu = 'Malaltia'; }
  if (n >= 1 && !S.dates.length) S.dates = [TODAY];
  if (n === 1) S.chat = 'closed';
  if (n <= 2) { S.resolved = false; S.tEnd = null; S.via = 'horaria'; }
  if (n === 2) startChat();
  if (n === 3) { if (!S.resolved) resolve('horaria', true); S.chat = 'closed'; S.toast = true; }
  if (n === 4) { if (!S.resolved) resolve('horaria', true); S.chat = 'closed'; S.mailIdx = 0; }
  render(); window.scrollTo({top:0, behavior:'smooth'});
}
function resolve(via, jump){ S.resolved = true; S.via = via; if (!S.tEnd) S.tEnd = jump ? Math.max(Date.now(), S.t0 + 47000) : Date.now(); }
function startChat(){
  S.chat = 'loading'; var k = 0;
  T.load = setInterval(function(){ k = (k+1) % LOADING.length; var e = $('#loadmsg'); if (e) e.textContent = tr(LOADING[k]); }, 650);
  T.chat = setTimeout(function(){ clearInterval(T.load); S.chat = 'done'; render(); }, 3000);
}
function startRec(){
  S.rec = 'rec'; render();
  var t0 = Date.now();
  T.rec = setInterval(function(){
    var s = Math.floor((Date.now()-t0)/1000), e = $('#rtm'); if (e) e.textContent = Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
    var bs = document.querySelectorAll('#rbars i'), ph = (Date.now()-t0)/180;
    for (var i=0;i<bs.length;i++) { var v = .18 + Math.abs(Math.sin(ph + i*.55)) * (.35 + Math.random()*.5); bs[i].style.transform = 'scaleY('+Math.min(1,v).toFixed(2)+')'; }
    if (s >= 7) stopRec();
  }, 90);
}
function stopRec(){
  clearInterval(T.rec); S.rec = 'trans'; render();
  T.trans = setTimeout(function(){
    S.infoText = (S.infoText.trim() ? S.infoText.trim() + ' ' : '') + tr(DICTAT); S.rec = 'idle'; S.infoErr = '';
    if (S.infoState === 'done') S.infoState = 'idle';
    render();
    var ta = $('#itx'); if (ta) { ta.classList.add('flash'); setTimeout(function(){ ta.classList.remove('flash'); }, 1400); }
  }, 1500);
}
function analitza(){
  var ta = $('#itx'); if (ta) S.infoText = ta.value;
  if (!S.infoText.trim() && !S.fotos.length && !S.infoPdf) { S.infoErr = 'Escriu, dicta o adjunta alguna cosa perquè Horaria la pugui llegir.'; render(); return; }
  S.infoErr = ''; S.infoState = 'loading'; render();
  T.an = setTimeout(function(){
    var b = [];
    if (infoMentionsSortida()) { b.push('No busca cobertura per a 5è ni 6è fins a les 14:00: són de sortida'); b.push('No proposa les tutores de 5è i 6è ni el Marc Ferrer: són fora del centre'); }
    if (infoMentionsGloria()) b.push('No assigna la Glòria abans de les 11:00');
    if (!b.length && S.infoText.trim()) b.push('Ho tindrà en compte en totes les propostes d\'avui: «'+esc(S.infoText.trim().slice(0,110))+(S.infoText.trim().length>110?'…':'')+'»');
    if (S.fotos.length) b.push('Ha llegit '+(S.fotos.length===1?'la foto adjunta':'les '+S.fotos.length+' fotos adjuntes')+' com a document del dia');
    if (S.infoPdf) b.push('Ha llegit el document d\'organització de la sortida');
    S.infoBullets = b; S.infoState = 'done'; render();
  }, 1600);
}

var A = {
  go: function(v){ goStep(+v); },
  next: function(){ goStep(S.step+1); },
  reset: function(){ clearT(); S = freshState(); render(); window.scrollTo({top:0, behavior:'smooth'}); },
  theme: function(){ var d = !isDark(); document.documentElement.setAttribute('data-theme', d?'dark':'light'); try{ localStorage.setItem('hp-demo-theme', d?'dark':'light'); }catch(e){} render(); },
  chan: function(v){ clearT(); S.channel = v; S.sent = false; S.waPick = false; if (S.waChoice !== 'ok') { S.waView = 'marta'; S.waBot = 0; S.waChoice = ''; S.waCanvi = false; } render(); },
  quick: function(){ S.sel = FR.map(function(f){return f.id;}); S.dates = [TODAY]; S.motiu = 'Tot el dia'; S.nota = ''; S.justificant = false; S.fitxer = false; S.sendErr = ''; S.sent = true; render(); T.send = setTimeout(function(){ goStep(1); }, 1700); },
  totdia: function(){ S.sel = FR.map(function(f){return f.id;}); S.sendErr = ''; render(); },
  avui: function(){ S.dates = [TODAY]; render(); },
  altredia: function(){ var k = Object.keys(DATES).filter(function(d){ return S.dates.indexOf(d) < 0; })[0]; if (k) { S.dates.push(k); S.dates.sort(); } render(); },
  deldate: function(v){ S.dates = S.dates.filter(function(d){ return d !== v; }); render(); },
  cmfr: function(v){ var i = S.cmFr.indexOf(v); if (i >= 0) S.cmFr.splice(i, 1); else S.cmFr.push(v); S.cmErr = ''; render(); },
  fr: function(v){ S.sendErr = ''; var i = S.sel.indexOf(v); if (i>=0) S.sel.splice(i,1); else S.sel.push(v); S.sel.sort(); render(); },
  just: function(){ S.justificant = !S.justificant; render(); },
  fitxer: function(){ S.fitxer = !S.fitxer; render(); },
  send: function(){ var n = $('#nota'); if (n) S.nota = n.value; if (!S.dates.length) { S.sendErr = 'Selecciona almenys un dia'; render(); return; } if (!S.sel.length) { S.sendErr = 'Selecciona almenys una franja'; render(); return; } S.sendErr = ''; S.sent = true; render(); T.send = setTimeout(function(){ goStep(1); }, 1700); },
  wapick: function(){ S.waPick = true; render(); },
  wapickx: function(){ S.waPick = false; render(); },
  wafwd: function(){
    S.waPick = false; S.waView = 'bot'; S.waBot = 0; S.waChoice = ''; S.waCanvi = false;
    S.sel = FR.map(function(f){return f.id;}); S.dates = [TODAY]; S.motiu = 'Malaltia'; render();
    T.w1 = setTimeout(function(){ S.waBot = 1; render(); }, 700);
    T.w2 = setTimeout(function(){ S.waBot = 2; render(); }, 3400);
  },
  waok: function(){ S.waChoice = 'ok'; resolve('horaria'); render(); },
  wacanvi: function(){ S.waCanvi = true; render(); },
  wacancel: function(){ S.waChoice = 'cancel'; render(); },
  wareset: function(){ S.waView = 'marta'; S.waBot = 0; S.waChoice = ''; S.waCanvi = false; render(); },
  tab: function(v){ S.jtab = v; S.gview = null; render(); },
  toastx: function(){ S.toast = false; render(); },
  info: function(){ var ta = $('#itx'); if (ta) S.infoText = ta.value; S.infoOpen = !S.infoOpen; S.manualOpen = false; if (!S.infoOpen && S.rec !== 'idle') { clearInterval(T.rec); clearTimeout(T.trans); S.rec = 'idle'; } render(); },
  manual: function(){ S.manualOpen = !S.manualOpen; S.infoOpen = false; render(); },
  rec: function(){ var ta = $('#itx'); if (ta) S.infoText = ta.value; startRec(); },
  recstop: function(){ stopRec(); },
  reccancel: function(){ clearInterval(T.rec); S.rec = 'idle'; render(); },
  ipdf: function(){ S.infoPdf = !S.infoPdf; if (S.infoState==='done') S.infoState='idle'; render(); },
  foto: function(v){ var ta = $('#itx'); if (ta) S.infoText = ta.value; if (S.fotos.length >= 4) return; S.fotos.push(v === 'cam' ? (S.fotos.indexOf('nota')<0?'nota':'pissarra') : (S.fotos.indexOf('graella')<0?'graella':'nota')); if (S.infoState==='done') S.infoState='idle'; render(); },
  delfoto: function(v){ S.fotos.splice(+v, 1); if (S.infoState==='done') S.infoState='idle'; render(); },
  analitza: analitza,
  manualok: function(){
    ['cmData','cmAbsent','cmWho','cmGrup','cmMotiu'].forEach(function(k){ var e = $('[data-m='+k+']'); if (e) S[k] = e.value; });
    if (!S.cmAbsent || !S.cmWho) { S.cmErr = 'Tria el mestre absent i qui cobreix.'; render(); return; }
    if (S.cmAbsent !== 'Marta Puig') { S.cmErr = 'En aquesta demo, prova-ho amb la Marta Puig.'; render(); return; }
    if (S.cmWho === S.cmAbsent) { S.cmErr = 'Qui cobreix no pot ser la mateixa persona que falta.'; render(); return; }
    if (!S.cmFr.length) { S.cmErr = 'Selecciona almenys una franja.'; render(); return; }
    clearT(); S.cmErr = ''; S.sel = S.cmFr.slice(); S.motiu = S.cmMotiu || 'No especificat'; S.manualWho = S.cmWho;
    S.manualOpen = false; S.chat = 'closed'; resolve('manual'); S.step = 3; S.jtab = 'avisos'; S.toast = true; render(); window.scrollTo({top:0, behavior:'smooth'});
  },
  openchat: function(){ goStep(2); },
  closechat: function(){ if (S.chat === 'loading') return; clearT(); S.chat = 'closed'; if (S.step === 2) { S.step = 1; } render(); },
  apply: function(){ S.chat = 'applied'; resolve('horaria'); render(); T.ap = setTimeout(function(){ S.step = 3; S.chat = 'closed'; S.toast = true; render(); }, 650); },
  mail: function(v){ S.mailIdx = +v; render(); },
  gview: function(v){ S.gview = v || null; render(); },
  pers: function(v){ S.personalOpen = S.personalOpen === +v ? null : +v; render(); },
  grup: function(v){ S.grup = v; render(); },
  baixes: function(v){ S.baixesActive = v === '1'; render(); },
  novabaixa: function(){ S.novaBaixa = !S.novaBaixa; render(); },
  tog: function(v){ S.tog[v] = !S.tog[v]; render(); },
  xlsx: function(){ exportXlsx(); },
  pdf: function(){ exportPdf(); },
  noop: function(){}
};
document.addEventListener('click', function(e){
  var b = e.target.closest('[data-a]'); if (!b || b.disabled) return;
  if (b.tagName === 'A' && b.getAttribute('href') === '#') e.preventDefault();
  var f = A[b.getAttribute('data-a')]; if (f) f(b.getAttribute('data-v'), b, e);
});
function model(e){
  var el = e.target, k = el.getAttribute && el.getAttribute('data-m'); if (!k) return;
  S[k] = el.value;
  if (k === 'infoText' && S.infoState === 'done' && e.type === 'input') { S.infoState = 'idle'; }
  if (k === 'cmAbsent') { var d = STAFF.filter(function(x){ return x.n === el.value; })[0]; if (d) S.cmGrup = d.g; }
  if (el.getAttribute('data-r')) render();
}
document.addEventListener('input', function(e){ if (e.target.tagName === 'TEXTAREA') model(e); });
document.addEventListener('change', model);
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape' && S.chat === 'done') A.closechat();
  if (e.target.matches('input,textarea,select')) return;
  if (e.key === 'ArrowRight' && S.step < 4) goStep(S.step+1);
  if (e.key === 'ArrowLeft' && S.step > 0) goStep(S.step-1);
});
matchMedia('(prefers-color-scheme: dark)').addEventListener && matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(){ if (!EMBED) renderTop(); });

/* ---------- Integració amb la web (iframe) ---------- */
window.addEventListener('message', function(e){
  var d = e.data; if (e.source !== window.parent || !d || d.hp !== 'go') return;
  if (d.channel) S.channel = d.channel;
  goStep(d.step|0);
  if ((d.step|0) === 0 && (d.sub|0) >= 1) { S.sent = true; clearT(); render(); }
});
var st0 = parseInt(qs.get('step'), 10);
if (st0 >= 1 && st0 <= 5) goStep(st0 - 1); else render();
if (EMBED) try { parent.postMessage({hp:'ready'}, '*'); } catch(e){}
})();
</script>
</body>
